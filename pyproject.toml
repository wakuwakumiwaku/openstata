[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openstata"
version = "0.2.0"
description = "Stata-inspired clinical statistics for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wakuwakumiwaku" }]
keywords = ["clinical-research", "statistics", "stata", "table-one", "epidemiology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
export = [
  "openpyxl>=3.1",
  "python-docx>=1.1",
]
dev = [
  "build>=1.2",
  "openpyxl>=3.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "python-docx>=1.1",
  "ruff>=0.6",
]

[project.scripts]
openstata = "openstata.cli:main"

[project.urls]
Homepage = "https://github.com/wakuwakumiwaku/openstata"
Repository = "https://github.com/wakuwakumiwaku/openstata"
Issues = "https://github.com/wakuwakumiwaku/openstata/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openstata = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
